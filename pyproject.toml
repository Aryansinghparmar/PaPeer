[project]
name = "rag-papeer-project"
version = "0.1.0"
description = "Papeer: a LangGraph RAG research assistant with a FastAPI + React web app"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies only: this is what the Docker image installs (via the
# exported requirements.txt). Test and evaluation tooling live in the
# dependency groups below.
dependencies = [
    "aiosqlite>=0.22.1",
    "arxiv>=3.0.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.2.1",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langsmith>=0.8.3",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "qdrant-client>=1.17.1",
    "requests>=2.33.1",
    "tavily-python>=0.7.24",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
eval = [
    "deepeval>=4.0.0",
]

[tool.uv]
# A plain `uv sync` installs everything for local work (tests + evaluation);
# `uv export --no-default-groups` produces the runtime-only requirements.txt.
default-groups = ["dev", "eval"]
